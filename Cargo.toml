[package]
name = "shell_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"

egui = "0.34.3"
eframe = "0.34.3"
#egui-file-dialog = "0.13.0" #  For file dialogs.

# Markdown viewer windows (see `src/markdown.rs`). egui_commonmark 0.23 is the
# release built against egui 0.34. `better_syntax_highlighting` colours fenced
# code blocks via syntect (pure-Rust regex, no C deps); the default features
# load local images the document references.
egui_commonmark = { version = "0.23.0", features = ["better_syntax_highlighting"] }
# Image loaders for those pictures. `http` fetches remote images (README
# badges etc.) on a background thread via ehttp.
egui_extras = { version = "0.34.3", features = ["file", "http", "image", "gif", "webp", "svg"] }
# Same parser egui_commonmark uses: the viewer finds `<details>` blocks with it
# so they can render as collapsible sections. Adds nothing new to the build.
pulldown-cmark = { version = "0.13", default-features = false }
# egui_extras decodes only the formats enabled on the `image` crate.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }

shell = { path = "../shell" }

# Files panel Deep search (see `src/deep_search.rs`): ripgrep's own library
# crates, so results match what `rg` finds. `ignore` is its parallel,
# .gitignore-aware directory walker; `grep-searcher` and `grep-regex` its
# line-oriented search.
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"

# Files panel (see `src/files.rs`): `ShellExecuteW` opens a file with its default
# program, as an Explorer double-click does; `SHGetFileInfoW` gives Explorer's
# type name ("Text Document") for the details pane; the drive functions list
# "This PC" for the drive menu. Same version `shell` uses, so this adds nothing
# new to the build. The PATH panel (see `src/path_env.rs`) reads and writes
# the User and System `Path` registry values, broadcasts the change as
# Windows' own dialog does, and runs itself elevated (`ShellExecuteExW`
# "runas") to write the System one. Shell commands (see `src/running.rs`) run
# in a job object, so Stop ends everything they started.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }